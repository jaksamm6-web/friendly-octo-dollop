
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title></title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      text-align: center;
    }

    header {
      background: #192953;
      padding: 25px 15px;
      font-size: 26px;
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 700px;
      margin: 80px auto 40px;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
    }

    .image-link {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 25px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .image-link img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.25s ease;
    }

    .image-link:hover img {
      transform: scale(1.03);
    }

    .btn {
      display: inline-block;
      background: #22c55e;
      color: #07130a;
      padding: 16px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .btn:hover {
      background: #86efac;
    }

    footer {
      color: #cbd5e1;
      padding: 25px 10px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        font-size: 22px;
      }

      main {
        margin-top: 45px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header>
    
  </header>

  <main>
    <h1>Discover More</h1>

    <p>Click the image below to visit the website.</p>

    <!-- Clickable image -->
    <a
      class="image-link"
      href="https://indefinitelynutmegbile.com/ji3cya2qdx?key=29cb5eb4cd836fe4e0dd2e18648566e4"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit website"
    >
      <img
        src="https://raw.githubusercontent.com/jaiijsk18-ux/solid-telegram/a262fcfbe73458a70c7d2560683309cdce43d0dd/17579990480118900738.jpg"
        alt="Discover more"
      >
    </a>

    <!-- Green button -->
    <a
      class="btn"
      href="https://indefinitelynutmegbile.com/ji3cya2qdx?key=29cb5eb4cd836fe4e0dd2e18648566e4"
      target="_blank"
      rel="noopener noreferrer"
    >
      Visit Website
    </a>

  </main>

  <footer>
    &copy; 2026 My Website. All rights reserved.
  </footer>

</body>
</html>
